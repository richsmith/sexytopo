name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/signing.jks"
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/signing.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "sexytopo-${GITHUB_REF_NAME}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "sexytopo-${GITHUB_REF_NAME}.apk"

      - name: Extract release notes
        run: python3 scripts/extract_release_notes.py "${GITHUB_REF_NAME}" > notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: SexyTopo ${{ github.ref_name }}
          body_path: notes.md
          files: sexytopo-*.apk

      - name: Prepare Play Store release notes
        run: |
          mkdir -p whatsnew
          # Play limits the "what's new" text to 500 characters; truncate to be safe.
          head -c 500 notes.md > whatsnew/whatsnew-en-US

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.hwyl.sexytopo
          releaseFiles: sexytopo-${{ github.ref_name }}.apk
          tracks: production
          status: completed
          whatsNewDirectory: whatsnew
